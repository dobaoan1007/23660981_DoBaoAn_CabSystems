openapi: 3.0.0

info:
  title: Driver Matching API
  description: |
    This API allows the CAB system to automatically find a suitable driver
    for a ride request.

    ### FR05:
    The system automatically finds a suitable driver.

    The system considers the driver's location, availability status
    and operational criteria when finding a suitable driver.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:
  /rides/{rideId}/driver-matching:
    post:
      summary: Find a suitable driver
      operationId: findSuitableDriver
      tags:
        - Driver Matching

      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: ID of the ride request
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Suitable driver found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverMatchResponse'

        '404':
          description: No suitable driver found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    DriverMatchResponse:
      type: object
      properties:
        rideId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        driverName:
          type: string
        driverStatus:
          type: string
          enum:
            - available
            - assigned
        matchingStatus:
          type: string
          enum:
            - driver_found
            - request_sent

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
