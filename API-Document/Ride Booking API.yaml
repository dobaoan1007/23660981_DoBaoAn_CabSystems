openapi: 3.0.0

info:
  title: Ride Booking API
  description: |
    This API allows customers to select a vehicle type and submit a ride
    booking request.

    ### FR04:
    The system allows customers to select a vehicle type and submit
    a ride request.

    After receiving a valid request, the system starts the process
    of finding a suitable driver.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:
  /rides:
    post:
      summary: Create a ride booking request
      operationId: createRideRequest
      tags:
        - Ride Booking

      security:
        - bearerAuth: []

      requestBody:
        description: Ride booking information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideRequest'

      responses:
        '201':
          description: Ride request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideResponse'

        '400':
          description: Invalid ride request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Customer is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RideRequest:
      type: object
      properties:
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
          description: Type of vehicle selected by the customer
      required:
        - pickupLocation
        - destination
        - vehicleType

    RideResponse:
      type: object
      properties:
        rideId:
          type: integer
          format: int64
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
        status:
          type: string
          enum:
            - searching_driver
            - driver_assigned
            - no_driver_found

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
