openapi: 3.0.0

info:
  title: Trip Status API
  description: |
    This API allows drivers to update the status of a trip during the
    ride process.

    ### FR07:
    The system allows drivers to update the trip status.

    The trip statuses include:
    - Driver arrived at pickup location.
    - Passenger picked up.
    - Trip in progress.
    - Trip completed.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:
  /trips/{tripId}/status:
    put:
      summary: Update trip status
      operationId: updateTripStatus
      tags:
        - Trip Status

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: ID of the trip
          schema:
            type: integer
            format: int64

      requestBody:
        description: New trip status
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'

      responses:
        '200':
          description: Trip status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripStatusResponse'

        '400':
          description: Invalid trip status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Driver is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    TripStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - arrived_at_pickup
            - passenger_picked_up
            - in_progress
            - completed
      required:
        - status

    TripStatusResponse:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
        status:
          type: string
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
